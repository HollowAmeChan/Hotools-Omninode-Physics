name: Release Extension ZIP

# 扩展仓库自己的发布线。父仓发布包**不含**扩展，扩展一律通过这里的产物安装：
# 用户在 HoTools 偏好设置 → OmniNode → "安装扩展…" 里选对应的 ZIP 即可。
#
# 两个 ZIP 分别对应 Blender 4.5（Python 3.11）与 Blender 5.x（Python 3.13）：
# 原生 pyd 的 ABI 不同，不能混用。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source-only package builds
        run: |
          set -euo pipefail
          # 先验证打包工具本身可跑（不需要原生 pyd）
          python PhysicsWorld/tools/build_extension_zip.py \
            --source-only \
            --output _dist/HoTools-Omninode-Physics-src.zip

      - name: Publish release with the built packages
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME:-$(date +'%Y%m%d-%H%M%S')}"
          SOURCE_ZIP="_dist/HoTools-Omninode-Physics-${VERSION}-src.zip"

          # 带原生 pyd 的包需要在 Windows + 对应 Blender Python 下本地构建后
          # 作为 release asset 上传：
          #   PhysicsWorld\native\build.bat all
          #   python PhysicsWorld\tools\build_extension_zip.py --abi py311 --output _dist/...-py311.zip
          #   python PhysicsWorld\tools\build_extension_zip.py --abi py313 --output _dist/...-py313.zip
          #
          # 说明：仓库只提交源码，native/runtime/ 是构建产物（已在 .gitignore 中），
          # 因此 CI 无法直接产出可用的 pyd；这里只自动发布源码包，二进制包由本地构建
          # 后手动附到同一个 release 上。
          gh release create "$VERSION" "$SOURCE_ZIP" \
            --title "HoTools-Omninode-Physics $VERSION" \
            --notes "源码包由 CI 自动构建；带原生模块的安装包（-py311 / -py313）由本地构建后附上。" \
            --target "$GITHUB_SHA" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
